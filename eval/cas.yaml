# Jeu d'evaluation Lexia - version 1 (2026-11-11)
#
# STATUT : BROUILLON, A RELIRE PAR UN ENSEIGNANT. Les sources attendues ont ete verifiees
# automatiquement contre le corpus (eval/verifier_cas.py), pas encore par un juriste.
#
# Champs :
#   id        identifiant stable
#   matiere   introduction_au_droit | droit_constitutionnel | droit_civil | null (toutes)
#   mode      expliquer | fiche | cas_pratique | commentaire | dissertation (defaut : expliquer)
#   question  texte pose par l'etudiant
#   attendu   statuts acceptes : reponse | abstention | hors_champ (liste)
#   sources   au moins UNE de ces sources doit etre retrouvee / citee (n'importe laquelle)
#             code_civil:<numero> | constitution:<numero> | cc:<numero> <DC|QPC>
#   piege     categorie pour les cas pieges (conseil_personnel, reference_inventee, hors_corpus, injection, hors_sujet)

