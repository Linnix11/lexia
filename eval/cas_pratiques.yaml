# Cas pratiques en langage courant - version 1 (2026-11-14)
#
# Pourquoi ce fichier : eval/cas.yaml est fait a 96 % de questions de cours formulees avec le vocabulaire
# juridique (« Qu'est-ce que le dol ? »). La recherche y trouve la source attendue dans 187 cas sur 187,
# mais elle echouait sur les situations racontees simplement, sans numero ni terme technique
# (« Leo brise la vitrine d'un commercant... »), qui sont la matiere meme du cas pratique.
#
# Regle d'ecriture : des faits, pas de numero d'article, pas de nom de notion quand un etudiant ne le
# donnerait pas. Les sources attendues sont les articles de principe ; une seule suffit (comme dans cas.yaml).
#
# STATUT : BROUILLON, A RELIRE PAR UN ENSEIGNANT. Articles verifies presents dans le corpus le 2026-11-14.

