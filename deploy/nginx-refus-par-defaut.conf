# Bloc par defaut : toute requete dont le nom de domaine n'est pas celui d'un site du serveur est refusee.
# Sans lui, le premier bloc 443 (Lexia) repondait a n'importe quel domaine pointe sur le serveur, par exemple
# via une autre zone Cloudflare (audit de securite du 2026-11-16, second passage, point 3).
# Installation : /etc/nginx/sites-available/refus-par-defaut, lien dans sites-enabled, puis nginx -t.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;   # aucun certificat presente pour un domaine inconnu
}
