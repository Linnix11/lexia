# Instance de Lexia qui recoit les requetes (D145). Installee une seule fois par publier.sh dans
# /etc/nginx/conf.d/lexia-amont.conf, puis reecrite par /usr/local/sbin/lexia-basculer a chaque bascule (8000 ou
# 8001) : ne pas la modifier a la main, ni la remplacer a la publication.
upstream lexia_amont {
    server 127.0.0.1:8000;
}
