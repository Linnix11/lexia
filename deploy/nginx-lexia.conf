# nginx devant Lexia. Remplacer lexia.exemple.fr par votre domaine.
# Installe par deploy/installer_serveur.sh ; le HTTPS est ajoute ensuite par certbot.
# API : 120 requetes par minute et par adresse. Chaque page en fait 4 a 5 : a 20 par minute, une navigation
# un peu rapide renvoyait des 503 et le site croyait l'etudiant deconnecte. Les questions au modele restent
# limitees par l'application (RATE_LIMIT_PER_MINUTE).
limit_req_zone $binary_remote_addr zone=lexia_api:10m rate=120r/m;
# Connexion, inscription, suppression de compte : 5 essais par minute et par adresse (en plus des freins de l'API)
limit_req_zone $binary_remote_addr zone=lexia_auth:10m rate=5r/m;

server {
    listen 80;
    listen [::]:80;
    server_name lexia.exemple.fr;

    server_tokens off;   # ne pas annoncer la version de nginx
    client_max_body_size 64k;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Les fichiers du front ont un nom versionne : cache long
    location /assets/ {
        proxy_pass http://127.0.0.1:8000;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; form-action 'self'; frame-ancestors 'self'; object-src 'none'; base-uri 'self'; upgrade-insecure-requests" always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    # Adresse reelle des visiteurs derriere Cloudflare (sans effet sinon)
    include /etc/nginx/snippets/lexia-cloudflare.conf;

    location ~ ^/api/auth/(connexion|inscription|supprimer)$ {
        limit_req zone=lexia_auth burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Depot des cours (PDF jusqu'a 20 Mo) : seule route qui accepte un gros corps de requete
    location /api/cours {
        client_max_body_size 21m;
        limit_req zone=lexia_api burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # API : la generation d'une reponse peut prendre jusqu'a ~60 s (modele + secours)
    location /api/ {
        limit_req zone=lexia_api burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # En-tetes de securite. Repetes dans /assets : un add_header dans un bloc location remplace ceux du serveur.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; form-action 'self'; frame-ancestors 'self'; object-src 'none'; base-uri 'self'; upgrade-insecure-requests" always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
}
