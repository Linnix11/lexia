# nginx devant Lexia. Remplacer lexia.exemple.fr par votre domaine.
# Installe par deploy/installer_serveur.sh ; le HTTPS est ajoute ensuite par certbot.
limit_req_zone $binary_remote_addr zone=lexia_api:10m rate=20r/m;

server {
    listen 80;
    listen [::]:80;
    server_name lexia.exemple.fr;

    client_max_body_size 64k;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Les fichiers du front ont un nom versionne : cache long
    location /assets/ {
        proxy_pass http://127.0.0.1:8000;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Depot des cours (PDF jusqu'a 20 Mo) : seule route qui accepte un gros corps de requete
    location /api/cours {
        client_max_body_size 21m;
        limit_req zone=lexia_api burst=10 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # API : la generation d'une reponse peut prendre jusqu'a ~60 s (modele + secours)
    location /api/ {
        limit_req zone=lexia_api burst=10 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}
