# nginx devant Lexia. Remplacer lexia.exemple.fr par votre domaine.
# Installe par deploy/installer_serveur.sh ; le HTTPS est ajoute ensuite par certbot.
# lexia_amont : instance en service (8000 ou 8001), dans /etc/nginx/conf.d/lexia-amont.conf, reecrit a chaque
# bascule (deploy/basculer.sh, D145).
# API : 120 requetes par minute et par adresse. Chaque page en fait 4 a 5 : a 20 par minute, une navigation
# un peu rapide renvoyait des 503 et le site croyait l'etudiant deconnecte. Les questions au modele restent
# limitees par l'application (RATE_LIMIT_PER_MINUTE).
# Cle des limites : l'adresse en IPv4, le reseau /64 en IPv6, comme l'API (api/auth.py, ip_client). Un abonnement
# IPv6 recoit au moins un /64 : par adresse entiere, un seul client changeait d'adresse a chaque essai (audit du
# 2026-11-23, B9). nginx ecrit l'adresse en forme courte (« :: » pour la plus longue suite de zeros) : les
# 4 premiers groupes, completes par des 0 quand « :: » tombe dedans. « :: » couvre au moins deux groupes : il ne
# finit avant le 4e que dans la forme « a::b:c:d:e:f » (regle 4). Adresse commencant par « :: » (IPv4
# encapsulee, boucle locale) : adresse entiere. Teste par tests/test_deploiement.py.
map $remote_addr $lexia_cle_limite {
    "~^([0-9a-f]{1,4}:[0-9a-f]{1,4}:[0-9a-f]{1,4}:[0-9a-f]{1,4}):" $1;
    "~^([0-9a-f]{1,4}:[0-9a-f]{1,4}:[0-9a-f]{1,4})::" $1:0;
    "~^([0-9a-f]{1,4}:[0-9a-f]{1,4})::" $1:0:0;
    "~^([0-9a-f]{1,4})::([0-9a-f]{1,4}):[0-9a-f]{1,4}:[0-9a-f]{1,4}:[0-9a-f]{1,4}:[0-9a-f]{1,4}$" $1:0:0:$2;
    "~^([0-9a-f]{1,4})::" $1:0:0:0;
    default $binary_remote_addr;
}
limit_req_zone $lexia_cle_limite zone=lexia_api:10m rate=120r/m;
# Connexion, inscription, suppression de compte : 5 essais par minute et par adresse (en plus des freins de l'API)
limit_req_zone $lexia_cle_limite zone=lexia_auth:10m rate=5r/m;

server {
    listen 80;
    listen [::]:80;
    server_name lexia.exemple.fr www.lexia.exemple.fr;

    server_tokens off;   # ne pas annoncer la version de nginx
    client_max_body_size 64k;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Les fichiers du front ont un nom versionne : cache long
    location /assets/ {
        proxy_pass http://lexia_amont;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; form-action 'self'; frame-ancestors 'self'; object-src 'none'; base-uri 'self'; upgrade-insecure-requests" always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    # Adresse reelle des visiteurs derriere Cloudflare (sans effet sinon)
    include /etc/nginx/snippets/lexia-cloudflare.conf;

    # Aussi le code de connexion, le mot de passe oublie, la 2FA et les e-mails (audit du 19/11, SEC-10).
    # Rafale de 10 : une salle de TD derriere une seule adresse se connecte en debut de seance (SRV-6).
    location ~ ^/api/auth/(connexion|connexion/code|inscription|supprimer|mot-de-passe/[a-z-]+|2fa/[a-z-]+|email/[a-z-]+)$ {
        limit_req zone=lexia_auth burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://lexia_amont;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Depot des cours (PDF jusqu'a 20 Mo) : seule route qui accepte un gros corps de requete
    location /api/cours {
        client_max_body_size 21m;
        limit_req zone=lexia_api burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://lexia_amont;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # API : la generation d'une reponse peut prendre jusqu'a ~60 s (modele + secours)
    location /api/ {
        limit_req zone=lexia_api burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://lexia_amont;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://lexia_amont;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # En-tetes de securite. Repetes dans /assets : un add_header dans un bloc location remplace ceux du serveur.
    # HSTS etendu aux sous-domaines (audit du 2026-11-23, B11) : seul www existe, en HTTPS (n8n est sur un autre
    # domaine). Tout futur sous-domaine devra etre en HTTPS. Pas de preload : difficile a retirer.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; form-action 'self'; frame-ancestors 'self'; object-src 'none'; base-uri 'self'; upgrade-insecure-requests" always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
}
