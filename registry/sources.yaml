# Registre des sources Lexia.
# Une entree par source. Les champs marques "a_verifier" doivent etre confirmes
# (conditions d'utilisation, mode d'acces) avant toute ingestion.
#
# statut : actif | a_verifier | en_attente_acces | exclu

sources:
  - id: constitution_1958
    nom: Constitution du 4 octobre 1958 (texte integral en vigueur)
    type: texte_officiel
    autorite: Conseil constitutionnel
    url: https://www.conseil-constitutionnel.fr/le-bloc-de-constitutionnalite/texte-integral-de-la-constitution-du-4-octobre-1958-en-vigueur
    acces: page_html
    licence: a_verifier  # texte officiel ; verifier les mentions legales du site
    frequence_maj: a_chaque_revision_constitutionnelle
    matieres: [droit_constitutionnel, introduction_au_droit]
    niveaux: [L1]
    ingestion: ingest/sources/constitution.py
    statut: actif
    derniere_synchro: null

  - id: code_civil
    nom: Code civil
    type: texte_officiel
    autorite: DILA / Legifrance
    url: https://echanges.dila.gouv.fr/OPENDATA/LEGI/
    identifiant: LEGITEXT000006070721
    acces: archive_dila  # Freemium_legi_global_*.tar.gz ; API PISTE possible plus tard
    licence: a_verifier  # conditions de reutilisation des donnees DILA a confirmer
    frequence_maj: quotidienne (archives incrementales LEGI_*.tar.gz)
    perimetre: toutes les versions d'articles, en_vigueur = false pour les versions passees
    matieres: [droit_civil, introduction_au_droit]
    niveaux: [L1]
    ingestion: ingest/sources/legi.py
    statut: actif
    derniere_synchro: null

  - id: decisions_conseil_constitutionnel
    nom: Decisions du Conseil constitutionnel (DC, QPC)
    type: jurisprudence
    autorite: Conseil constitutionnel
    url: https://echanges.dila.gouv.fr/OPENDATA/CONSTIT/
    acces: archive_dila  # Freemium_constit_global_*.tar.gz
    licence: a_verifier  # conditions de reutilisation des donnees DILA a confirmer
    frequence_maj: hebdomadaire
    perimetre: decisions DC et QPC (contentieux electoral exclu)
    matieres: [droit_constitutionnel]
    niveaux: [L1]
    ingestion: ingest/sources/constit.py
    statut: actif
    derniere_synchro: null

  - id: judilibre
    nom: Decisions de la Cour de cassation (Judilibre)
    type: jurisprudence
    autorite: Cour de cassation
    url: https://echanges.dila.gouv.fr/OPENDATA/CASS/
    acces: archive_dila  # Freemium_cass_global_*.tar.gz ; API Judilibre (PISTE) possible plus tard
    licence: a_verifier  # conditions de reutilisation des donnees DILA a confirmer
    frequence_maj: hebdomadaire
    perimetre: >-
      arrets publies depuis 2016 ; 1re et 3e chambres civiles, Assemblee pleniere,
      chambre mixte ; 2e chambre civile limitee a responsabilite, accidents, assurance,
      indemnisation. Sommaires officiels indexes ; moyens annexes exclus.
    matieres: [droit_civil]
    niveaux: [L1]
    ingestion: ingest/sources/cass.py
    statut: actif
    derniere_synchro: null

  # Bibliographies : metadonnees uniquement (auteur, titre, edition, etablissement, lien).
  - id: bibliographie_faculte_1
    nom: Bibliographie publique - faculte a choisir
    type: bibliographie
    autorite: a_choisir
    url: null
    acces: saisie_manuelle
    licence: metadonnees_uniquement
    frequence_maj: annuelle
    matieres: [introduction_au_droit, droit_constitutionnel, droit_civil]
    niveaux: [L1]
