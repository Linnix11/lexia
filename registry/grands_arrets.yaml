# ---------------------------------------------------------------------------------------------------------------
# Droit penal general
# ---------------------------------------------------------------------------------------------------------------
- id: menard
  nom: {motif: '\bmenard\b|\bbon juge magnaud\b|\bmagnaud\b', seul: false}
  citation: "Trib. corr. Château-Thierry, 4 mars 1898, Ménard"
  juridiction: Tribunal correctionnel de Château-Thierry
  formation: null
  date: 1898-03-04
  reference: null
  matieres: [droit_penal]
  statut: consacre
  portee: "Premier jugement célèbre à relaxer l'auteur d'un vol commis pour échapper à un péril (la faim) ; l'état de nécessité, admis ensuite par la jurisprudence, figure à l'article 122-7 du Code pénal depuis 1994."
  fiche:
    faits: "Une jeune mère sans ressources, qui n'a pas mangé depuis plusieurs jours et doit nourrir son enfant, vole un pain chez un boulanger. Elle est poursuivie pour vol devant le tribunal correctionnel de Château-Thierry, présidé par le juge Magnaud."
    question: "La personne qui commet une infraction pour échapper à un danger grave et actuel, ici la faim, peut-elle être déclarée pénalement responsable ?"
    solution: "Le tribunal la relaxe, en relevant que la faim peut enlever à l'être humain une partie de son libre arbitre et que l'auteur a agi sous l'empire d'une nécessité. La relaxe a été confirmée en appel, sur un autre motif."
    apport: "Jugement symbolique, souvent cité comme l'origine de la reconnaissance de l'état de nécessité comme cause d'irresponsabilité pénale, que le Code pénal de 1810 ne prévoyait pas."
    portee: "L'état de nécessité est aujourd'hui prévu par l'article 122-7 du Code pénal : n'est pas pénalement responsable la personne qui, face à un danger actuel ou imminent qui menace elle-même, autrui ou un bien, accomplit un acte nécessaire à la sauvegarde de la personne ou du bien, sauf disproportion entre les moyens employés et la gravité de la menace. Jugement de première instance : sa motivation n'a pas valeur de principe."

- id: laboube
  nom: {motif: '\blaboube\b', seul: true}
  citation: "Cass. crim., 13 décembre 1956, Laboube"
  juridiction: Cour de cassation
  formation: chambre criminelle
  date: 1956-12-13
  reference: null
  matieres: [droit_penal, procedure_penale]
  statut: consacre
  portee: "Toute infraction suppose que son auteur ait agi avec intelligence et volonté ; le discernement du mineur, exigé par cet arrêt, est aujourd'hui prévu par l'article 122-8 du Code pénal et l'article L. 11-1 du Code de la justice pénale des mineurs."
  fiche:
    faits: "Un enfant de dix ans blesse involontairement un camarade en jouant. Il est poursuivi pour blessures involontaires devant le tribunal pour enfants, qui prononce contre lui une mesure éducative."
    question: "Un mineur peut-il être déclaré coupable d'une infraction, même non intentionnelle, sans qu'on recherche s'il a compris et voulu son acte ?"
    solution: "Non. La chambre criminelle casse : toute infraction, même non intentionnelle, suppose que son auteur ait agi avec intelligence et volonté. Les juges devaient rechercher si l'enfant avait compris et voulu l'acte qui lui était reproché."
    apport: "Le discernement, c'est-à-dire l'aptitude à comprendre et à vouloir, est une condition de la responsabilité pénale de tout auteur d'infraction, y compris d'une infraction d'imprudence : un très jeune enfant ne peut être pénalement responsable."
    portee: "Consacré par la loi du 9 septembre 2002 (article 122-8 du Code pénal : les mineurs capables de discernement sont pénalement responsables), puis par le Code de la justice pénale des mineurs, en vigueur depuis le 30 septembre 2021, dont l'article L. 11-1 présume non capables de discernement les mineurs de moins de treize ans."

- id: lacour
  nom: {motif: '\blacour\b', seul: false}
  citation: "Cass. crim., 25 octobre 1962, Lacour"
  juridiction: Cour de cassation
  formation: chambre criminelle
  date: 1962-10-25
  reference: null
  matieres: [droit_penal]
  statut: nuance
  portee: "La complicité suppose un fait principal punissable (criminalité d'emprunt) : l'instigateur d'un crime jamais tenté n'est pas complice ; le législateur a depuis créé le délit autonome de mandat criminel (article 221-5-1 du Code pénal, loi du 9 mars 2004)."
  fiche:
    faits: "Un homme remet de l'argent à un tiers pour qu'il tue une personne. Le tiers accepte l'argent mais ne passe jamais à l'acte et ne commence aucune exécution du meurtre. L'instigateur est poursuivi comme complice de tentative d'assassinat."
    question: "Celui qui provoque à commettre un crime peut-il être puni comme complice quand l'auteur sollicité n'a même pas tenté de le commettre ?"
    solution: "Non. La complicité n'est punissable que s'il existe un fait principal punissable. Faute de tentative, c'est-à-dire de commencement d'exécution par l'auteur, l'instigateur ne peut être poursuivi comme complice."
    apport: "Illustration de la criminalité d'emprunt : le complice emprunte la criminalité de l'auteur principal (aujourd'hui article 121-7 du Code pénal). Sans infraction principale, consommée ou tentée, il n'y a pas de complicité."
    portee: "Le principe demeure. Pour combler la lacune révélée par l'arrêt, la loi du 9 mars 2004 a créé le délit de mandat criminel (article 221-5-1 du Code pénal), qui punit le fait de faire à une personne des offres ou promesses pour qu'elle commette un assassinat ou un empoisonnement, lorsque ce crime n'a été ni commis ni tenté."

- id: perdereau
  nom: {motif: '\bperdereau\b', seul: true}
  citation: "Cass. crim., 16 janvier 1986, Perdereau"
  juridiction: Cour de cassation
  formation: chambre criminelle
  date: 1986-01-16
  reference: "85-95.461"
  matieres: [droit_penal]
  statut: actuel
  portee: "Infraction impossible : les violences portées avec l'intention de tuer une personne déjà morte constituent une tentative d'homicide volontaire punissable ; toujours cité."
  index: "cass_criminelle:JURITEXT000007053746:sommaire"

- id: enfant-a-naitre-2001
  nom: null
  citation: "Cass. ass. plén., 29 juin 2001"
  juridiction: Cour de cassation
  formation: Assemblée plénière
  date: 2001-06-29
  reference: "99-85.973"
  matieres: [droit_penal]
  statut: actuel
  portee: "L'interprétation stricte de la loi pénale s'oppose à ce que l'homicide involontaire soit étendu à l'enfant à naître ; toujours appliqué."
  index: "judilibre:JURITEXT000007046781:sommaire"

