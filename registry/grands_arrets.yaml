- id: clement-bayard
  nom: {motif: '\bclement[- ]bayard\b|\bcoquerel\b', seul: true}
  citation: "Cass. req., 3 août 1915, Clément-Bayard"
  juridiction: Cour de cassation
  formation: chambre des requêtes
  date: 1915-08-03
  reference: null
  matieres: [droit_des_biens]
  statut: actuel
  portee: "L'abus du droit de propriété (acte sans utilité pour le propriétaire, accompli pour nuire à autrui) engage la responsabilité de son auteur ; toujours invoqué."
  fiche:
    faits: "Un propriétaire installe sur son terrain, en bordure de celui de son voisin, constructeur de dirigeables, de hautes charpentes de bois surmontées de tiges de fer pointues. Ces installations ne lui servent à rien ; un dirigeable du voisin, en manœuvrant, s'y déchire."
    question: "Un propriétaire peut-il être condamné pour l'usage qu'il fait de son propre terrain, alors que l'article 544 du Code civil lui donne le droit d'en disposer de la manière la plus absolue ?"
    solution: "Oui. La chambre des requêtes approuve les juges du fond d'avoir retenu un abus du droit de propriété : le dispositif ne présentait pour le propriétaire aucune utilité et n'avait été installé que pour nuire au voisin. Il est condamné à réparer le dommage et à enlever les tiges."
    apport: "Le droit de propriété, si absolu soit-il, ne peut être exercé dans le seul but de nuire : l'abus de droit suppose l'intention de nuire et l'absence d'intérêt légitime pour le propriétaire."
    portee: "Toujours invoqué. À distinguer des troubles anormaux de voisinage, qui engagent la responsabilité sans faute ni intention de nuire (jurisprudence consacrée par l'article 1253 du Code civil, issu de la loi du 15 avril 2024)."

- id: troubles-voisinage-1986
  nom: null
  citation: "Cass. civ. 2e, 19 novembre 1986"
  juridiction: Cour de cassation
  formation: deuxième chambre civile
  date: 1986-11-19
  reference: "84-16.379"
  matieres: [droit_des_biens]
  statut: consacre
  portee: "Nul ne doit causer à autrui un trouble anormal de voisinage : principe autonome, sans faute ; consacré par l'article 1253 du Code civil (loi du 15 avril 2024)."
  index: "judilibre:JURITEXT000007017687:sommaire"

- id: maison-de-poesie
  nom: {motif: '\bmaison de poesie\b', seul: true}
  citation: "Cass. civ. 3e, 31 octobre 2012, Maison de Poésie"
  juridiction: Cour de cassation
  formation: troisième chambre civile
  date: 2012-10-31
  reference: "11-16.304"
  matieres: [droit_des_biens]
  statut: actuel
  portee: "Le propriétaire peut consentir un droit réel de jouissance spéciale de son bien, distinct de l'usufruit et du droit d'usage et d'habitation : la liste des droits réels n'est pas fermée."
  index: "judilibre:JURITEXT000026573047:sommaire"

