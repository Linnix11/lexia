# Grands arrets des matieres de licence (D124).
#
# Liste redigee par Lexia le 2026-11-23. STATUT : A RELIRE PAR UN ENSEIGNANT (docs/relecture-enseignant/).
#
# Pour chaque arret :
#   citation : forme courte citee a l'etudiant (juridiction, formation, date, nom d'usage) ;
#   reference : numero de pourvoi, de requete ou de decision quand il existe ;
#   statut : actuel (toujours applique) | consacre (repris par un texte) | nuance (solution corrigee ou limitee
#            depuis) | abandonne (n'est plus le droit positif : ne jamais le presenter comme tel) ;
#   portee : ce qu'il en reste aujourd'hui, en une ou deux phrases ;
#   index : identifiant du passage de l'index qui porte la decision (sommaire officiel, ou considerant de
#           principe pour le Conseil constitutionnel). Verifie dans l'index du 17 novembre 2026
#           (tests/test_grands_arrets_notions.py le controle sur l'index reel) ;
#   fiche : seulement pour un arret absent de l'index (Cour de cassation avant 1960, Cour de justice de l'Union).
#           Fiche redigee par Lexia, sans reprise d'un recueil (GAJC, GAJA...), d'une note d'arret ou d'un
#           manuel : faits, question de droit, solution, apport, portee. Source officielle citee seulement
#           quand elle existe ;
#   nom : motif (texte sans accents, minuscules) qui reconnait l'arret nomme dans une question ; seul: false
#         exige que la question parle d'un arret ou de jurisprudence (nom courant : Franck, Mercier...).
#
# Les notions (fin du fichier) relient une question a ses grands arrets : leurs motifs sont lus sur la question
# sans accents ni majuscules ; avec : second motif exige en plus ; sauf : motif qui ecarte la notion. L'ordre des arrets d'une notion est l'ordre
# d'ajout aux extraits (3 au plus par question, api/grands_arrets.py).

version: "2026-11-23"

arrets:

# ---------------------------------------------------------------------------------------------------------------
# Droit civil : responsabilite extracontractuelle
# ---------------------------------------------------------------------------------------------------------------
- id: teffaine
  nom: {motif: '\bteffaine\b', seul: true}
  citation: "Cass. civ., 16 juin 1896, Teffaine"
  juridiction: Cour de cassation
  formation: chambre civile
  date: 1896-06-16
  reference: null
  matieres: [droit_civil]
  statut: consacre
  portee: "Principe général de responsabilité du fait des choses tiré de l'ancien article 1384, alinéa 1er ; repris par l'arrêt Jand'heur (1930) puis par l'article 1242, alinéa 1er, du Code civil."
  fiche:
    faits: "La chaudière d'un remorqueur à vapeur explose et tue un ouvrier mécanicien qui travaillait à bord. Sa veuve demande réparation au propriétaire du remorqueur. L'explosion est due à un défaut de construction de la chaudière ; aucune faute du propriétaire n'est établie."
    question: "Le propriétaire d'une chose qui a causé un dommage en répond-il sans que la victime ait à prouver sa faute ?"
    solution: "Oui. La Cour de cassation retient la responsabilité du propriétaire sur le fondement de l'article 1384, alinéa 1er, du Code civil (aujourd'hui article 1242, alinéa 1er) : l'accident étant dû à un vice de construction, il ne peut s'exonérer en prouvant la faute du constructeur ou le caractère caché du vice."
    apport: "Premier arrêt à voir dans l'alinéa 1er de l'article 1384, jusque-là lu comme une simple annonce des cas qui suivent, une responsabilité du fait des choses indépendante de toute faute du responsable. L'arrêt répond à la multiplication des accidents causés par les machines."
    portee: "Pour les accidents du travail, la loi du 9 avril 1898 a peu après organisé un régime spécial d'indemnisation. Le principe général a été confirmé par l'arrêt Jand'heur (1930) et figure aujourd'hui à l'article 1242, alinéa 1er, du Code civil."

- id: jand-heur
  nom: {motif: "\\bjand'?heur\\b", seul: true}
  citation: "Cass., ch. réunies, 13 février 1930, Jand'heur"
  juridiction: Cour de cassation
  formation: chambres réunies
  date: 1930-02-13
  reference: null
  matieres: [droit_civil]
  statut: actuel
  portee: "Toujours appliqué : responsabilité de plein droit du gardien (article 1242, alinéa 1er, du Code civil), écartée seulement par une cause étrangère. Les accidents de la circulation relèvent depuis 1985 de la loi du 5 juillet 1985."
  fiche:
    faits: "Une enfant est renversée et blessée par un camion de livraison. Ses représentants agissent contre la société propriétaire du camion. La cour de renvoi refuse d'appliquer l'article 1384, alinéa 1er, du Code civil, au motif que le camion était conduit par un homme au moment de l'accident : il faudrait alors prouver une faute du conducteur (article 1382 ancien)."
    question: "La présomption de l'article 1384, alinéa 1er, s'applique-t-elle à une chose actionnée par la main de l'homme, et comment le gardien peut-il s'en libérer ?"
    solution: "Les chambres réunies cassent. La présomption pèse sur celui qui a sous sa garde la chose inanimée qui a causé le dommage ; elle ne cède que devant la preuve d'un cas fortuit ou de force majeure ou d'une cause étrangère qui ne lui est pas imputable. Il ne suffit pas au gardien de prouver qu'il n'a commis aucune faute ou que la cause du dommage est restée inconnue. La loi ne distingue pas selon que la chose était ou non actionnée par la main de l'homme ; il n'est pas nécessaire qu'elle ait un vice : la responsabilité s'attache à la garde de la chose, non à la chose elle-même."
    apport: "Fondation de la responsabilité du fait des choses : une responsabilité qui ne repose pas sur la faute, pour toute chose, dangereuse ou non, en mouvement ou non, et dont le gardien ne s'exonère que par une cause étrangère."
    portee: "Toujours le droit positif : l'article 1242, alinéa 1er, du Code civil (ancien article 1384) est appliqué dans ces termes, la jurisprudence parlant aujourd'hui de responsabilité de plein droit. Pour un accident de la circulation impliquant un véhicule terrestre à moteur, la loi n° 85-677 du 5 juillet 1985 s'applique seule depuis 1986."

- id: franck
  nom: {motif: '\bfranck\b', seul: false}
  citation: "Cass., ch. réunies, 2 décembre 1941, Franck"
  juridiction: Cour de cassation
  formation: chambres réunies
  date: 1941-12-02
  reference: null
  matieres: [droit_civil]
  statut: actuel
  portee: "Définition toujours retenue de la garde : usage, direction et contrôle de la chose ; le propriétaire dépossédé par un vol perd la garde."
  fiche:
    faits: "Un médecin prête sa voiture à son fils mineur. La voiture est volée pendant la nuit ; le voleur, en la conduisant, renverse et tue un passant. La famille de la victime agit contre le propriétaire de la voiture sur le fondement de l'article 1384, alinéa 1er, du Code civil."
    question: "Le propriétaire d'une chose qui lui a été volée en reste-t-il le gardien, responsable des dommages qu'elle cause entre les mains du voleur ?"
    solution: "Non. Privé de l'usage, de la direction et du contrôle de sa voiture par l'effet du vol, le propriétaire n'en a plus la garde et n'est plus soumis à la présomption de l'article 1384, alinéa 1er."
    apport: "La garde est une garde matérielle, de fait, et non juridique : elle appartient à celui qui exerce sur la chose les pouvoirs d'usage, de direction et de contrôle, même sans droit (le voleur)."
    portee: "Définition toujours utilisée pour l'article 1242, alinéa 1er, du Code civil. Le propriétaire est présumé gardien, mais il peut prouver qu'il avait transféré la garde. Pour les accidents de la circulation, la loi du 5 juillet 1985 s'applique."

- id: oxygene-liquide
  nom: {motif: "\\boxygene liquide\\b", seul: true}
  citation: "Cass. civ. 2e, 5 janvier 1956, Oxygène liquide"
  juridiction: Cour de cassation
  formation: deuxième chambre civile
  date: 1956-01-05
  reference: null
  matieres: [droit_civil]
  statut: nuance
  portee: "Distinction de la garde de la structure et de la garde du comportement, encore citée mais appliquée de façon limitée aux choses dotées d'un dynamisme propre et dangereux."
  fiche:
    faits: "Des bouteilles d'oxygène comprimé, remises par la société qui les remplit à un transporteur, explosent et blessent des personnes. Les juges du fond mettent hors de cause la société propriétaire des bouteilles, au motif que leur garde avait été transférée au transporteur."
    question: "Celui qui détient matériellement une chose au moment du dommage en est-il toujours le gardien, même quand le dommage vient de la structure interne de la chose, qu'il ne peut ni connaître ni maîtriser ?"
    solution: "La Cour de cassation casse : le propriétaire ne cesse d'être gardien que si celui à qui il a confié la chose a reçu, avec son usage, le pouvoir d'en surveiller et d'en contrôler tous les éléments, et donc la possibilité de prévenir lui-même le dommage. Les juges devaient le rechercher."
    apport: "Naissance de la distinction entre la garde de la structure, qui peut rester au propriétaire ou au fabricant, et la garde du comportement, qui passe au détenteur."
    portee: "Distinction toujours mentionnée, mais appliquée avec prudence et surtout à des choses dangereuses dotées d'un dynamisme propre. Depuis 1998, la responsabilité du fait des produits défectueux (articles 1245 et suivants du Code civil) couvre une grande partie de ces situations."

- id: trichard
  nom: {motif: '\btrichard\b', seul: true}
  citation: "Cass. civ. 2e, 18 décembre 1964, Trichard"
  juridiction: Cour de cassation
  formation: deuxième chambre civile
  date: 1964-12-18
  reference: null
  matieres: [droit_civil]
  statut: consacre
  portee: "Le trouble mental du gardien n'est pas une cause étrangère ; la loi du 3 janvier 1968 a ensuite posé que celui qui cause un dommage sous l'empire d'un trouble mental est obligé à réparation (article 414-3 du Code civil)."
  index: "judilibre:JURITEXT000006967475:sommaire"

- id: dangereux
  nom: {motif: '\bdangereux\b', seul: false}
  citation: "Cass. ch. mixte, 27 février 1970, Dangereux"
  juridiction: Cour de cassation
  formation: chambre mixte
  date: 1970-02-27
  reference: "68-10.276"
  matieres: [droit_civil]
  statut: actuel
  portee: "La victime par ricochet (ici une concubine) n'a pas à justifier d'un lien de droit avec la victime directe ; solution toujours appliquée."
  index: "judilibre:JURITEXT000006982751:sommaire"

- id: desmares
  nom: {motif: '\bdesmares\b', seul: true}
  citation: "Cass. civ. 2e, 21 juillet 1982, Desmares"
  juridiction: Cour de cassation
  formation: deuxième chambre civile
  date: 1982-07-21
  reference: "81-12.850"
  matieres: [droit_civil]
  statut: abandonne
  portee: "Abandonné par la deuxième chambre civile le 6 avril 1987, qui admet de nouveau l'exonération partielle du gardien par la faute de la victime ; pour les accidents de la circulation, la loi du 5 juillet 1985 a remplacé cette jurisprudence."
  index: "judilibre:JURITEXT000007010831:sommaire"

- id: faute-victime-1987
  nom: null
  citation: "Cass. civ. 2e, 6 avril 1987"
  juridiction: Cour de cassation
  formation: deuxième chambre civile
  date: 1987-04-06
  reference: "85-12.833"
  matieres: [droit_civil]
  statut: actuel
  portee: "Revirement après l'arrêt Desmares : le gardien est partiellement exonéré quand il prouve que la faute de la victime a contribué au dommage."
  index: "judilibre:JURITEXT000007018470:sommaire"

- id: fullenwarth
  nom: {motif: '\bfullenwarth\b', seul: true}
  citation: "Cass. ass. plén., 9 mai 1984, Fullenwarth"
  juridiction: Cour de cassation
  formation: Assemblée plénière
  date: 1984-05-09
  reference: "79-16.612"
  matieres: [droit_civil]
  statut: actuel
  portee: "Il suffit d'un acte du mineur, cause directe du dommage, pour engager la responsabilité de ses parents ; confirmé en 2002 (simple fait causal, sans faute de l'enfant)."
  index: "judilibre:JURITEXT000007013643:sommaire"

- id: gabillet
  nom: {motif: '\bgabillet\b', seul: true}
  citation: "Cass. ass. plén., 9 mai 1984, Gabillet"
  juridiction: Cour de cassation
  formation: Assemblée plénière
  date: 1984-05-09
  reference: "80-14.994"
  matieres: [droit_civil]
  statut: actuel
  portee: "Un jeune enfant peut être gardien d'une chose : la garde ne suppose pas le discernement. Toujours appliqué."
  index: "judilibre:JURITEXT000007013792:sommaire"

- id: derguini
  nom: {motif: '\bderguini\b', seul: true}
  citation: "Cass. ass. plén., 9 mai 1984, Derguini"
  juridiction: Cour de cassation
  formation: Assemblée plénière
  date: 1984-05-09
  reference: "80-93.481"
  matieres: [droit_civil]
  statut: actuel
  portee: "La faute d'un enfant peut être retenue sans vérifier qu'il était capable de discerner les conséquences de son acte (faute objective) ; toujours appliqué."
  index: "judilibre:JURITEXT000007013642:sommaire"

- id: lemaire
  nom: {motif: '\blemaire\b', seul: false}
  citation: "Cass. ass. plén., 9 mai 1984, Lemaire"
  juridiction: Cour de cassation
  formation: Assemblée plénière
  date: 1984-05-09
  reference: "80-93.031"
  matieres: [droit_civil]
  statut: actuel
  portee: "Même solution que Derguini : la faute de la victime mineure peut lui être opposée sans recherche de son discernement."
  index: "judilibre:JURITEXT000007013641:sommaire"

- id: blieck
  nom: {motif: '\bblieck\b', seul: true}
  citation: "Cass. ass. plén., 29 mars 1991, Blieck"
  juridiction: Cour de cassation
  formation: Assemblée plénière
  date: 1991-03-29
  reference: "89-15.231"
  matieres: [droit_civil]
  statut: actuel
  portee: "Responsabilité du fait d'autrui fondée sur l'article 1242, alinéa 1er, pour qui accepte d'organiser et de contrôler à titre permanent le mode de vie d'autrui ; étendue depuis (associations sportives, mineurs placés)."
  index: "judilibre:JURITEXT000007026394:sommaire"

- id: bertrand
  nom: {motif: '\bbertrand\b', seul: false}
  citation: "Cass. civ. 2e, 19 février 1997, Bertrand"
  juridiction: Cour de cassation
  formation: deuxième chambre civile
  date: 1997-02-19
  reference: "94-21.111"
  matieres: [droit_civil]
  statut: actuel
  portee: "Les parents ne s'exonèrent de leur responsabilité de plein droit que par la force majeure ou la faute de la victime, non en prouvant qu'ils n'ont commis aucune faute de surveillance ou d'éducation."
  index: "judilibre:JURITEXT000007038104:sommaire"

- id: parents-2002
  nom: null
  citation: "Cass. ass. plén., 13 décembre 2002"
  juridiction: Cour de cassation
  formation: Assemblée plénière
  date: 2002-12-13
  reference: "00-13.787"
  matieres: [droit_civil]
  statut: actuel
  portee: "La responsabilité des parents suppose seulement que le dommage ait été directement causé par le fait, même non fautif, du mineur."
  index: "judilibre:JURITEXT000007045176:sommaire"

- id: levert
  nom: {motif: '\blevert\b', seul: false}
  citation: "Cass. civ. 2e, 10 mai 2001, Levert"
  juridiction: Cour de cassation
  formation: deuxième chambre civile
  date: 2001-05-10
  reference: "99-11.287"
  matieres: [droit_civil]
  statut: actuel
  portee: "La responsabilité des parents n'est pas subordonnée à l'existence d'une faute de l'enfant ; solution confirmée par l'Assemblée plénière en 2002."
  index: "judilibre:JURITEXT000007045606:sommaire"

- id: costedoat
  nom: {motif: '\bcostedoat\b', seul: true}
  citation: "Cass. ass. plén., 25 février 2000, Costedoat"
  juridiction: Cour de cassation
  formation: Assemblée plénière
  date: 2000-02-25
  reference: "97-17.378"
  matieres: [droit_civil]
  statut: actuel
  portee: "Le préposé qui agit sans excéder les limites de la mission que lui a impartie son commettant n'engage pas sa responsabilité à l'égard des tiers ; toujours appliqué, avec les limites posées par l'arrêt Cousin."
  index: "judilibre:JURITEXT000007043704:sommaire"

- id: cousin
  nom: {motif: '\bcousin\b', seul: false}
  citation: "Cass. ass. plén., 14 décembre 2001, Cousin"
  juridiction: Cour de cassation
  formation: Assemblée plénière
  date: 2001-12-14
  reference: "00-82.066"
  matieres: [droit_civil, droit_penal]
  statut: actuel
  portee: "Le préposé condamné pénalement pour une infraction intentionnelle, même commise sur l'ordre du commettant, engage sa responsabilité civile envers la victime."
  index: "judilibre:JURITEXT000007045753:sommaire"

- id: perruche
  nom: {motif: '\bperruche\b', seul: false}
  citation: "Cass. ass. plén., 17 novembre 2000, Perruche"
  juridiction: Cour de cassation
  formation: Assemblée plénière
  date: 2000-11-17
  reference: "99-13.701"
  matieres: [droit_civil]
  statut: abandonne
  portee: "Abandonné par la loi du 4 mars 2002 : nul ne peut se prévaloir d'un préjudice du seul fait de sa naissance (article L. 114-5 du Code de l'action sociale et des familles)."
  index: "judilibre:JURITEXT000007041543:sommaire"

- id: boot-shop
  nom: {motif: "\\bboot shop\\b|\\bmyr'?ho\\b", seul: true}
  citation: "Cass. ass. plén., 6 octobre 2006, Boot Shop (Myr'Ho)"
  juridiction: Cour de cassation
  formation: Assemblée plénière
  date: 2006-10-06
  reference: "05-13.255"
  matieres: [droit_civil, droit_des_contrats]
  statut: nuance
  portee: "Le tiers au contrat peut invoquer un manquement contractuel dès lors qu'il lui a causé un dommage ; confirmé en 2020 (arrêt Sucrerie de Bois Rouge), la réforme de la responsabilité civile en projet n'étant pas adoptée."
  index: "judilibre:JURITEXT000007052928:sommaire"

# ---------------------------------------------------------------------------------------------------------------
# Droit des contrats et responsabilite contractuelle
# ---------------------------------------------------------------------------------------------------------------
- id: cie-generale-transatlantique
  nom: {motif: "\\bcompagnie generale transatlantique\\b", seul: true}
  citation: "Cass. civ., 21 novembre 1911, Compagnie générale transatlantique"
  juridiction: Cour de cassation
  formation: chambre civile
  date: 1911-11-21
  reference: null
  matieres: [droit_des_contrats, droit_civil]
  statut: actuel
  portee: "Le transporteur de personnes est tenu d'une obligation de sécurité : conduire le voyageur sain et sauf à destination ; obligation étendue depuis à d'autres contrats."
  fiche:
    faits: "Un passager voyage sur un navire d'une compagnie maritime. Pendant la traversée, il est blessé par un tonneau mal arrimé qui tombe sur lui. Il demande réparation à la compagnie."
    question: "Le transporteur répond-il de la sécurité du passager en vertu du contrat de transport lui-même, sans que la victime ait à prouver une faute ?"
    solution: "Oui. L'exécution du contrat de transport comporte pour le transporteur l'obligation de conduire le voyageur sain et sauf à destination. Cette obligation naît du contrat ; le transporteur est responsable s'il ne l'exécute pas, sauf cause étrangère."
    apport: "Découverte, dans le contrat, d'une obligation de sécurité que les parties n'avaient pas écrite : le juge ajoute au contrat les suites que l'équité, l'usage ou la loi donnent à l'obligation (ancien article 1135, aujourd'hui article 1194 du Code civil)."
    portee: "Toujours appliqué au transport de personnes, l'obligation de sécurité de résultat couvrant le temps du transport. Elle a été étendue à d'autres contrats, souvent comme une obligation de moyens. Le transport ferroviaire relève aussi de règles de l'Union européenne."

- id: mercier
  nom: {motif: '\bmercier\b', seul: false}
  citation: "Cass. civ., 20 mai 1936, Mercier"
  juridiction: Cour de cassation
  formation: chambre civile
  date: 1936-05-20
  reference: null
  matieres: [droit_des_contrats, droit_civil]
  statut: nuance
  portee: "Le médecin doit des soins consciencieux, attentifs et conformes aux données acquises de la science (obligation de moyens) ; la responsabilité médicale repose aujourd'hui sur la loi (article L. 1142-1 du Code de la santé publique) plutôt que sur le contrat."
  fiche:
    faits: "Une patiente traitée par rayons X pour une affection du nez développe une lésion de la peau (radiodermite). Elle agit contre son médecin plusieurs années après le traitement. Le délai pour agir dépendait de la nature, contractuelle ou délictuelle, de la responsabilité invoquée."
    question: "Quelle est la nature de la responsabilité du médecin envers son patient, et à quoi s'engage-t-il ?"
    solution: "Il se forme entre le médecin et son patient un véritable contrat. Le médecin s'engage, non pas à guérir, mais à donner des soins consciencieux, attentifs et, sauf circonstances exceptionnelles, conformes aux données acquises de la science. La violation de cet engagement engage sa responsabilité contractuelle."
    apport: "Le contrat médical : la responsabilité du médecin devient contractuelle. L'engagement de donner des soins conformes aux données acquises de la science illustre l'obligation de moyens, opposée à l'obligation de résultat."
    portee: "Depuis la loi du 4 mars 2002, la responsabilité des professionnels de santé pour faute est fixée par l'article L. 1142-1 du Code de la santé publique, et la Cour de cassation ne la fonde plus sur le contrat. L'exigence de soins conformes aux données acquises de la science demeure ; la distinction des obligations de moyens et de résultat reste enseignée."

- id: canal-de-craponne
  nom: {motif: '\bcanal de craponne\b|\bcraponne\b', seul: true}
  citation: "Cass. civ., 6 mars 1876, Canal de Craponne"
  juridiction: Cour de cassation
  formation: chambre civile
  date: 1876-03-06
  reference: null
  matieres: [droit_des_contrats]
  statut: abandonne
  portee: "Abandonné par l'ordonnance du 10 février 2016 : l'article 1195 du Code civil permet la révision pour imprévision des contrats conclus depuis le 1er octobre 2016. Le refus reste la règle pour les contrats antérieurs."
  fiche:
    faits: "Des conventions du XVIe siècle avaient fixé la redevance due par les propriétaires de terres arrosées par le canal de Craponne, en Provence. Trois siècles plus tard, la redevance ne couvre plus les frais d'entretien du canal. La cour d'appel l'augmente, au nom de l'équité."
    question: "Le juge peut-il modifier un contrat devenu déséquilibré par un changement de circonstances que les parties n'avaient pas prévu (imprévision) ?"
    solution: "Non. La Cour de cassation casse : la règle de l'article 1134 du Code civil (force obligatoire du contrat) est générale et absolue ; en aucun cas il n'appartient aux tribunaux, si équitable que puisse leur paraître leur décision, de prendre en considération le temps et les circonstances pour modifier les conventions des parties et substituer des clauses nouvelles à celles qu'elles ont librement acceptées."
    apport: "Refus de la révision pour imprévision par le juge judiciaire, au nom de la force obligatoire du contrat. Le Conseil d'État a au contraire admis l'imprévision pour les contrats administratifs (arrêt Gaz de Bordeaux, 1916)."
    portee: "N'est plus le droit positif pour les contrats conclus depuis le 1er octobre 2016 : l'article 1195 du Code civil, issu de l'ordonnance du 10 février 2016, permet à une partie de demander une renégociation en cas de changement de circonstances imprévisible rendant l'exécution excessivement onéreuse, puis, à défaut d'accord, au juge de réviser ou de mettre fin au contrat. Les parties peuvent écarter ce texte."

- id: poussin
  nom: {motif: '\bpoussin\b', seul: false}
  citation: "Cass. civ. 1re, 22 février 1978, Poussin"
  juridiction: Cour de cassation
  formation: première chambre civile
  date: 1978-02-22
  reference: "76-11.551"
